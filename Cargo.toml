[package]
name = "mantrst"
version = "0.1.0"
edition = "2024"
description = "Translate local manual pages with a local LLM"
license = "GPL-2.0-or-later"

[[bin]]
name = "mantrst"
path = "rust/src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
unicode-linebreak = "0.1"
unicode-width = "0.2"
ureq = { version = "3.1", features = ["json"] }
